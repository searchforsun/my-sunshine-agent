# ============================================================
# sunshine-rag — Nacos 配置
# Data ID: sunshine-rag.yaml
# Group:   DEFAULT_GROUP
#
# 基础设施 SSOT：连接、密钥、Rerank API、存储、LLM 网关等。
# 检索/改写/分段业务参数 SSOT：MySQL rag_config_version（见 docker/mysql/init/16-sunshine-rag-config-seed.sql）。
# 评测调参建议 Prompt SSOT：rag.eval.suggest（SuggestService）。
# 修改后：python scripts/sync_nacos.py → 重启 rag-service
# ============================================================

server:
  port: 8400

spring:
  data:
    redis:
      host: ecs4c16g
      port: 6379
      password: redis123
  datasource:
    url: jdbc:mysql://ecs4c16g:3306/sunshine_rag?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: root123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

milvus:
  host: ecs4c16g
  port: 19530
  database: default

embedding:
  api-key: ${EMBEDDING_API_KEY:${QWEN_API_KEY:sk-22e7ab6f7bbb4078b7163facb4d3aee0}}
  base-url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
  model: text-embedding-v4

rag:
  webclient:
    insecure-ssl: true
  admin:
    token: sunshine-rag-admin-dev
  elasticsearch:
    enabled: true
    url: http://ecs4c16g:9200
    index: sunshine_rag_chunks
  rerank:
    enabled: true
    model: gte-rerank-v2
    base-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    input-size: 20
    timeout-seconds: 30
  eval:
    suggest:
      model: deepseek-v4-flash
      system-prompt: |
        你是企业 RAG 检索调优专家。输入含 gateFailures、failureModes、metrics、tuningHints、
        positiveMiss（正例未命中期望文档）、negativeFalsePositive（负例误召回）与 configRuntimeNotes。
        须先按 failureModes 区分主因，再给出建议；诊断必须解释「哪条门禁失败」与「对应 badcase 类型」。
        只输出 JSON，不要 markdown：
        {
          "diagnosis": "一段中文诊断",
          "suggestions": [
            {"path":"search.minScore","proposed":0.52,"reason":"..."}
          ],
          "textSuggestions": [
            {"target":"rewrite.rag.systemPrompt","kind":"prompt","proposed":"完整替换后的 Prompt","reason":"..."}
          ]
        }
        ## 失败模式与对策（必须遵守）
        - NEGATIVE_EMPTY_RATE_LOW：离题 query 被误召回 → 提高 search.minScore 或 rerank.minScore；禁止降低阈值；rewrite 慎改
        - POSITIVE_EMPTY_RATE_HIGH：正例零命中 → 适度降低 search.minScore，或修 rewrite 避免改偏
        - POSITIVE_RECALL_MISS / RECALL_AT_*_LOW：命中错误制度/交叉文档 → 优先 textSuggestions 改 rewrite.rag/hyde，绑定目标制度名
        - 禁止建议 rerank.minRelevance（bundle 未接入运行时，见 configRuntimeNotes）
        ## 输出约束
        suggestions.path 仅限：search.minScore / search.hybridPoolSize / search.rrfK / rerank.minScore / chunk.maxSize
        textSuggestions.kind 取 prompt / eval_query；Prompt 类须给出完整替换文本
        禁止无关参数；每条建议须引用具体 badcase 或 gateFailures 条目
  nacos:
    server-addr: http://ecs4c16g:8848/nacos
    username: nacos
    password: nacos
    group: DEFAULT_GROUP
  storage:
    type: minio
    minio:
      endpoint: http://ecs4c16g:9000
      access-key: minioadmin
      secret-key: minioadmin123
      bucket: sunshine-rag
  llm:
    base-url: http://127.0.0.1:8300/v1
    api-key: ${LLM_GATEWAY_API_KEY:}
    default-model: deepseek-v4-flash

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: sunshine-rag

logging:
  level:
    com.sunshine: debug
