# ============================================================
# sunshine-rag — Nacos 配置
# Data ID: sunshine-rag.yaml
# Group:   DEFAULT_GROUP
# ============================================================

server:
  port: 8400

spring:
  data:
    redis:
      host: ecs4c16g
      port: 6379
      password: redis123

milvus:
  host: ecs4c16g
  port: 19530
  database: default

embedding:
  api-key: ${EMBEDDING_API_KEY:${QWEN_API_KEY:sk-22e7ab6f7bbb4078b7163facb4d3aee0}}
  base-url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
  model: text-embedding-v4

rag:
  webclient:
    insecure-ssl: true
  admin:
    token: sunshine-rag-admin-dev
  elasticsearch:
    enabled: true
    url: http://ecs4c16g:9200
    index: sunshine_rag_chunks
  search:
    # IP 相似度下限（归一化向量下近似 cosine）；报销 vs 请假文档通常 < 0.48
    min-score: 0.48
    # 请求体未传 topK 时的默认值（orchestrator / eval 均依赖此 SSOT）
    default-top-k: 3
    # 默认策略：vector | hybrid | hybrid+rerank（请求体 strategy 可覆盖）
    strategy: hybrid+rerank
    rrf-k: 60
    hybrid-pool-size: 20
  rerank:
    enabled: true
    # 复用 embedding.api-key；也可单独配置 rag.rerank.api-key
    model: gte-rerank-v2
    base-url: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
    input-size: 20
    timeout-seconds: 30
    min-score: 0.25
    min-relevance: 0.25
  llm:
    base-url: http://127.0.0.1:8300/v1
    api-key: ${LLM_GATEWAY_API_KEY:}
    default-model: deepseek-v4-flash
  rewrite:
    rag:
      enabled: true
      model: deepseek-v4-flash
      system-prompt: |
        你是企业知识库检索 query 优化助手。用户问题将用于向量/混合检索。
        请补全域内关键词（制度、流程、报销、请假、差旅、考勤等），标准化专有名词表述。
        保留原意，不要编造事实；若已足够清晰则轻微润色即可。
        只输出 JSON：{"query":"优化后的检索 query"}，不要 markdown 或其他文字。
      hyde:
        enabled: true
        model: deepseek-v4-flash
        max-chars: 480
        system-prompt: |
          你是企业知识库 HyDE 助手。根据用户问题，写一段**可能出现在企业制度/流程文档中**的中文段落，
          用于向量检索匹配；不要写问答体，不要写「根据…规定」等元叙述，直接写制度条文式正文。
          只引用常见域内概念（报销、差旅、请假、考勤、审批等），**禁止编造**具体金额/日期/人名。
          只输出 JSON：{"document":"假想文档段落"}，不要 markdown 或其他文字。
    empty-recall:
      enabled: true
      model: deepseek-v4-flash
      max-alternatives: 2
      system-prompt: |
        你是企业知识库检索 query 改写助手。用户原始问题在向量/混合检索中零命中。
        请生成 %d 个不同表述的中文检索 query，用于二次检索。
        要求：
        - 必须保留原问题的核心业务领域与关键名词（如信息安全、保密、数据保护、财务、合规等），禁止改问无关主题；
        - 仅在同领域内补充「制度」「管理办法」「流程规范」等同义表述，勿硬塞报销、请假等与原问无关的关键词；
        - 不要编造事实。
        只输出 JSON：{"queries":["改写1","改写2"]}，不要 markdown 或其他文字。
    timeline:
      rag: "优化检索词"
      hyde: "生成参考文档"
      empty-recall: "换种方式再查"

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: sunshine-rag

logging:
  level:
    com.sunshine: debug
