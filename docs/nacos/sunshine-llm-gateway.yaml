# ============================================================
# sunshine-llm-gateway — Nacos 配置
# Data ID: sunshine-llm-gateway.yaml
# Group:   DEFAULT_GROUP
# ============================================================

server:
  port: 8300

spring:
  data:
    redis:
      host: ecs4c16g
      port: 6379
      password: redis123
  mvc:
    async:
      # 非流式 async 超时须大于上游 adapter response-timeout（180s），
      # 确保上游慢时先触发 ModelRouter 降级，而非 servlet 超时直接返回 503
      request-timeout: 200000

resource-manager:
  base-url: http://sunshine-resource-manager

# phase5 5.2 用量计量：MQ 生产（消费端 orchestrator 落库 llm_usage_record）
rocketmq:
  producer:
    endpoints: ecs4c16g:8081
    topic: llm-usage

llm:
  io-trace:
    enabled: true
  webclient:
    insecure-ssl: true
    # 上游 connect/response 超时：慢或挂起时快速失败，交由 ModelRouter 降级到备用模型。
    # responseTimeout 为字节级读空闲（心跳注释会重置），须 ≥ read-idle-timeout（data 事件间隔判定）
    connect-timeout: 10s
    response-timeout: 180s
    # SSE 数据静默超时：两次 data 事件之间静默超过该阈值即断开（上游半挂时快速降级）。
    # 须覆盖大上下文 prefill（并行工具批次后下一轮上下文骤增，首 token 前可能超 1 分钟无 data），
    # 避免误杀仍在推理的上游请求；在 OpenAiCompatibleAdapter 直接作用于 bodyToFlux 的 data 事件流
    # （SSE 解码器已消化心跳注释，无需字节级 ReadTimeoutHandler）
    read-idle-timeout: 180s
  usage:
    # 用量计量（5.2）：MQ topic 由 rocketmq.producer.topic 提供；消费端 orchestrator
    enabled: true
    tenant-id: default
    # 5.2.4 租户配额请求前校验（默认关，热切）：调 orchestrator /api/usage/quota/check，结果本地缓存
    quota:
      enabled: false
      orchestrator-base-url: http://sunshine-orchestrator
      check-ttl-seconds: 30

# 模型注册表 SSOT = resource-manager；此处仅保留加解密密钥材料
# 生产强制 env 注入（禁默认材料）；缺失时启动失败（fail-fast）
model:
  crypto:
    aes-key: ${MODEL_AES_KEY}

logging:
  level:
    com.sunshine: debug
