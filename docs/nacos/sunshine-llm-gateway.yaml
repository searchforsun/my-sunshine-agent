# ============================================================
# sunshine-llm-gateway — Nacos 配置
# Data ID: sunshine-llm-gateway.yaml
# Group:   DEFAULT_GROUP
# ============================================================

server:
  port: 8300

spring:
  data:
    redis:
      host: ecs4c16g
      port: 6379
      password: redis123
  mvc:
    async:
      # 非流式 async 超时须大于上游 adapter response-timeout（120s），
      # 确保上游慢时先触发 ModelRouter 降级，而非 servlet 超时直接返回 503
      request-timeout: 180000

llm:
  io-trace:
    enabled: true
  webclient:
    insecure-ssl: true
    # 上游 connect/response 超时：慢或挂起时快速失败，交由 ModelRouter 降级到备用模型
    connect-timeout: 10s
    response-timeout: 120s
    # SSE 流两次 chunk 之间静默超过该阈值即断开（上游半挂时快速降级，避免前端干等满 response-timeout）
    read-idle-timeout: 60s
  providers:
    deepseek:
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:sk-1e18dbd6edd4477bac49a0a290e92462}
      models:
        - name: deepseek-v4-pro
          context-window: 256000
          encoding: cl100k_base
        - name: deepseek-v4-flash
          context-window: 128000
          encoding: cl100k_base
    qwen:
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api-key: ${QWEN_API_KEY:sk-22e7ab6f7bbb4078b7163facb4d3aee0}
      models:
        - name: qwen-plus
          context-window: 262144
          encoding: cl100k_base
        - name: qwen-max
          context-window: 65536
          encoding: cl100k_base
  fallback:
    routes:
      deepseek-v4-pro: qwen-plus
      deepseek-v4-flash: qwen-plus

logging:
  level:
    com.sunshine: debug
