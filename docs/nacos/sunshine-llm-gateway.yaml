# ============================================================
# sunshine-llm-gateway — Nacos 配置
# Data ID: sunshine-llm-gateway.yaml
# Group:   DEFAULT_GROUP
# ============================================================

server:
  port: 8300

spring:
  data:
    redis:
      host: ecs4c16g
      port: 6379
      password: redis123
  mvc:
    async:
      # 非流式 async 超时须大于上游 adapter response-timeout（120s），
      # 确保上游慢时先触发 ModelRouter 降级，而非 servlet 超时直接返回 503
      request-timeout: 180000

llm:
  io-trace:
    enabled: true
  webclient:
    insecure-ssl: true
    # 上游 connect/response 超时：慢或挂起时快速失败，交由 ModelRouter 降级到备用模型
    connect-timeout: 10s
    response-timeout: 120s
    # SSE 数据静默超时：两次 data 事件之间静默超过该阈值即断开（上游半挂时快速降级，避免前端干等满 response-timeout）；
    # 在 OpenAiCompatibleAdapter 直接作用于 bodyToFlux 的 data 事件流（SSE 解码器已消化心跳注释，无需字节级 ReadTimeoutHandler）
    read-idle-timeout: 60s

# 模型注册表 SSOT = resource-manager；此处仅保留加解密密钥材料
# 生产强制 env 注入（禁默认材料）；缺失时启动失败（fail-fast）
model:
  crypto:
    aes-key: ${MODEL_AES_KEY}

resource-manager:
  base-url: http://sunshine-resource-manager

logging:
  level:
    com.sunshine: debug
