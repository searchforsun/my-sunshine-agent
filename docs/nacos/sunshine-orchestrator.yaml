# 表结构 SSOT：docker/mysql/init/11-sunshine-orchestrator.sql（禁止 Flyway）
#
# 【4.11 迁出】提示词正文 / 路由规则 SSOT = resource-manager Catalog（:8240）
#   - routing-rule.* / system-prompt / mode-overlay.* / timeline.* / …
#   - 种子：docker/mysql/init/19-sunshine-resource.sql（含表结构 + 全量种子）
#   - 本文件 agent.* 仅留数值/开关；提示词正文勿再当运营 SSOT
#   - 运营入口：sunshine-ui `/prompts`；验收：scripts/verify_prompt_catalog_live.py

server:
  port: 8200

spring:
  datasource:
    url: jdbc:mysql://ecs4c16g:3306/sunshine_chat?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ecs4c16g
      port: 6379
      password: redis123

agent:
  # 提示词/时间线正文已迁 resource-manager Catalog
  # （docker/mysql/init/19-sunshine-resource.sql）
  # 运营入口：/prompts；禁止再在本文件维护提示词正文
  # system-prompt / mode-overlay.* / answer.* / timeline.* / planner.harness → Catalog
  # 模型名 SSOT = resource-manager model_scene_binding（ModelSceneResolver）；禁止再写 *.model

  prompt:
    # skill overlay SSOT = skill-manager Catalog（无 Nacos 影子）

  # intent 模型 → scene=intent；classifier-prompt → Catalog intent.classifier.skill-agent（轨 A）/ intent.classifier.workflow（轨 B）
  # （已删除 agent.intent 配置壳，禁止再写）

  # timeline.* → Catalog timeline.intent / timeline.steps.* / timeline.hitl / …（T9）

  execution:
    default-mode: fast
    react:
      # ReAct think→tool 单 run 循环上限（chat 会话）。长任务（持续开发/多步执行）需充足余量，
      # 过低会触达 AgentScope 总结轮：该轮不传 tools，DeepSeek-V4 会把 DSML 工具调用
      # 泄漏进 content（乱码 + 工具时间线错乱）。50 轮 ≈ 50 次 think+工具对。
      max-iters: 50
      # task 会话（沙箱任务、coding 任务等长任务）的上限，高于 chat 值；
      # task 会话经 ReactExecutor 显式注入 request.maxIters 生效。
      task-max-iters: 100
      # 软限额收束缓冲 = maxIters 的 20%（/5），上限 10 轮，按各档位自动计算：
      # 50→10（约第 40 轮收束）、100→10（约第 90 轮）、30→6（约第 24 轮）；
      # 避免模型感知不到轮数上限、最后轮继续调工具 + 输出伪终稿后触发 AgentScope 总结轮。
      taskboard:
        enabled: true
      subagent:
        enabled: true
        # 子 Agent 单 run 轮数上限：能拆就拆后子任务可能含多步工具调用（8 太紧），放宽到 30
        max-iters: 30
        timeout-ms: 180000
        # cancel-result → Catalog id=react.subagent.cancel-result
      decision:
        # D21：默认关。Live：临时改 true → sync_nacos.py → restart orchestrator/bff；
        # 验收后务必改回 false（勿把生产默认翻 true）。
        # timeout-sec<=0 = 无限等待，仅用户作答/跳过/停止会话结束（验收需要可临时给 5）。
        enabled: true
        timeout-sec: 0
      async-tool:
        enabled: true
        # exec 观察窗口
        await-default-sec: 30
        await-max-sec: 120
        await-max-waits: 3
        # spawn 观察窗口（3×200=600，对齐 task-timeout-ms）
        spawn-await-default-sec: 120
        spawn-await-max-sec: 200
        spawn-await-max-waits: 3
        # worker 观察窗口（6×600：pro 复杂任务允许多轮观测，适配长 Worker 与墙钟 1h）
        worker-await-default-sec: 120
        worker-await-max-sec: 600
        worker-await-max-waits: 6
        exec-wall-timeout-sec: 600
        # 同消息并发派发上限：worker/spawn/exec 共享槽位，10 满足 pro 多路并发调研
        max-concurrent-per-message: 10
      # M3 session_search：task 会话 MAIN 注册 sunshine_session_search（chat/workflow 不注册）
      session-search:
        enabled: true
        # scope=workspace 跨会话检索的会话数上限（防 convId 列表膨胀；仅最近活跃会话）
        workspace-max-convs: 20
      # S-C 双阈值采纳 / 候选动态加载（skill-sticky v3.8）：
      # skillScores/agentScores 逐项置信 → conf>trigger 且 δ 达标触发；
      # conf>candidate 进候选（目录提权 + 可动态加载）；agent 可调度池取 Top-K。
      # 默认关闭：分类器提示词契约（skillScores 输出）升级后再开。
      skill-adoption:
        enabled: false
        trigger: 0.85
        candidate: 0.5
        delta: 0.2
        agent-top-k: 5
        candidate-top-k: 3
      # 4.7.7 L2 目标对齐（GoalAlignmentMiddleware）：周期性把原始问题+任务进度摆回模型面前，
      # 防 compaction 后漂移。MAIN-only；默认关灰度（Live 验收后改回 false）。
      goal-check:
        enabled: false
        every-n-think: 3
      # 4.7.7 L3 失败预算（FailureBudgetMiddleware）：工具失败达阈值注入强提示防同参数死循环。
      # ERROR 计数 / SUCCESS 清零；INTERRUPTED（用户取消）不计数（属 4.5.7 硬拒路径）。默认关灰度。
      tool-failure-budget:
        enabled: false
        same-signature-max: 2
        per-tool-max: 3
      # 5.5 工具语义检索注入（ToolRetrievalMiddleware）：
      # mode=full 全量注入（默认，现状）；mode=retrieval 按语义 Top-K 动态注入——
      # Tier 0 全量名列表进系统提示（目录），Tier 2 每轮经 Milvus 检索激活 topK 个工具 schema。
      # 恒注入工具（内置/沙箱/HITL 需确认）不受检索影响。默认 full 灰度，验收后按需开启。
      tool-inject:
        mode: full
        top-k: 8
        min-score: 0.3
        # 检索失败或空结果时回退全量注入，保证功能不丢
        fallback-full: true
    harness:
      # true：pro → PlannerHarnessExecutor
      # false：专业模式不可用（显式失败）；禁止静默改 fast，禁止回落旧动态规划
      enabled: true
      max-rounds: 12
      max-total-tasks: 24
      max-duration-ms: 14400000
      fallback-react:
        enabled: true
      planner:
        timeout-ms: 300000
        # v17：Planner 一次性 ReAct run，maxIters 兜底；60 轮 ≈ plan_submit(1) + dispatch×10 + await/task_status×多轮 + self_assess(1) + 综合回答
        max-iters: 60
      worker:
        timeout-ms: 3600000
      notebook:
        redis-ttl-seconds: 604800
        key-prefix: "sunshine:plan:notebook:"
        compression:
          near-keep-rounds: 10

  # 业务上下文权威层（business-context-authority §7）：Policy / business_task / 场景偏好。
  # 一期主路径 kind=chat；默认关（企业工具/工单类对话手动打开）。
  # 偏好白名单：改本文件后必跑 sync_nacos.py 并重启 orchestrator。
  business-context:
    enabled: false
    task:
      active-days: 14
      top-k: 5
      detail-max: 1
    preference:
      global-keys:
        - locale.language
        - locale.timezone
      # scene → 允许装载的 pref key 白名单
      whitelist:
        expense-assist:
          - refund.notify_channel
    # 冲突仲裁（authority §5.2）：有 scene 且存在 Policy/活跃任务板时，
    # 用 LLM 判定 L3 摘要与权威字段的直接矛盾并过滤，决策记审计；默认关。
    conflict-check:
      enabled: false
      max-l3-chars: 3000
      # LLM 判定失败兜底：drop=丢弃整段 L3（有权威块时低优先级安全）| keep=原样保留
      llm-failure-policy: drop
    # 场景 embedding 回退（authority §2.1b/§2.1c/§5.5）：资源召回未命中时，
    # query/正文向量化与场景 description 余弦匹配；api-key 生产经 Nacos 注入。默认关。
    scene-embedding:
      enabled: false
      min-score: 0.7
      top-k: 1
      model: text-embedding-v4
      dimension: 1024
      base-url: https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding
      api-key: ""
    # LLM 自动场景创建（authority §5.5b）：写路径 embedding 未命中时创建 auto 场景
    # （pending_review，仅嵌入检索可用；运营审核后升 active）。默认关。
    scene-auto:
      enabled: false
      max-pending: 20
      create-rate-limit: 3
      ttl-days: 30
      similarity-threshold: 0.85

  skill:
    # P1 强提示句式 — 须含命名组 skill；P0 / 由 SkillBindingParser 硬编码（与前端 / 补全对齐）
    hint-patterns:
      - "请使用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill"
      - "用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill\\s+处理"
      - "请用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill"

  # 对话级 Docker 沙箱（4.5 workspace 抽屉）
  # MAIN/SUB 常驻 sandbox__*；首次工具调用 / 抽屉 list 懒 create — docs/superpowers/specs/2026-07-16-conversation-sandbox-permanent-tools-design.md · SUB 默认见 2026-07-17-sub-agent-sandbox-default-design.md
  sandbox:
    conversation-ttl-sec: 1800
    purge-ttl-sec: 604800
    workspace-content-max-chars: 200000
    reaper-interval-ms: 60000
    cancellable-tools:
      - sandbox__exec
      - sandbox__grep
      - sandbox__glob
    cancel-after: 已取消
    # cancel-result → Catalog id=sandbox.cancel-result
    # budget-exhausted → Catalog id=sandbox.budget-exhausted
    # idle 30min → docker stop；自上次活动 7d → rm+清盘 — docs/superpowers/specs/2026-07-17-sandbox-container-lifecycle-design.md
    runtime:
      image: sunshine-sandbox-python:3.11-slim
      runtime-type: docker
      timeout-sec: 30
      memory-mb: 256
      cpus: 0.5
      network-allow: []
      exec-readonly-allow:
        - "ls *"
        - "pwd"
        - "python -m pytest *"
    # 工作区级完全体沙箱硬件档位（task-workspace-codex §4.4）- 创建工作区时校验 memoryMb/cpus 须命中 allowed-presets
    profiles:
      full:
        default-memory-mb: 2048
        default-cpus: 2.0
        allowed-presets:
          - { memoryMb: 1024, cpus: 1.0 }
          - { memoryMb: 2048, cpus: 2.0 }
          - { memoryMb: 4096, cpus: 4.0 }
        image: sunshine-sandbox-full:latest
    # 六工具 displayName / description / JSON Schema — TD-111 SSOT
    tools:
      sandbox__read:
        display-name: 读文件
        description: 读取沙箱内文本文件（/skills/{skillId}/... 或 /workspace（含实际工作区 /workspace/wt-xxx/...）；勿对目录调用）；大文件按需用 offset/limit 分段读取，勿一次读全
        properties:
          path:
            type: string
            description: 文件路径（须 /skills/{skillId}/... 或 /workspace/...（含 /workspace/wt-xxx/...）；禁止旧路径 /skill）
          offset:
            type: integer
            description: 起始行（1-based，可选）；缺省从第 1 行读起
          limit:
            type: integer
            description: 读取行数上限（可选）；大文件建议 50-200 行，先定位再读局部
        required:
          - path
      sandbox__write:
        display-name: 写文件
        description: 仅新建工作区文件（仅 /workspace（含 /workspace/wt-xxx/...）；已存在则失败，请改用 edit 或换路径）
        properties:
          path:
            type: string
            description: 写入路径（仅 /workspace（含 /workspace/wt-xxx/...））；仅允许新建，禁止覆盖已有文件
          content:
            type: string
            description: 新建文件全文内容
        required:
          - path
          - content
      sandbox__edit:
        display-name: 编辑文件
        description: 精确替换已有工作区文件中的唯一子串（仅 /workspace（含 /workspace/wt-xxx/...））
        properties:
          path:
            type: string
            description: 已有文件路径（仅 /workspace（含 /workspace/wt-xxx/...））
          old_string:
            type: string
            description: 待替换的精确原文（须在文件中唯一出现）
          new_string:
            type: string
            description: 替换后的文本
        required:
          - path
          - old_string
          - new_string
      sandbox__glob:
        display-name: 查找文件
        description: 在沙箱 jail 内按 glob 查找文件路径（优先收窄 path/pattern）
        properties:
          pattern:
            type: string
            description: glob 模式，如 **/*.py；尽量收窄
          path:
            type: string
            description: 搜索根（可选）：须为 /skills/{skillId}/... 或 /workspace（含 /workspace/wt-xxx/...）；禁止 /skill；缺省搜全部 jail
        required:
          - pattern
      sandbox__grep:
        display-name: 搜索内容
        description: 在沙箱 jail 内按正则搜索文件内容（须提供 pattern）
        properties:
          pattern:
            type: string
            description: 搜索正则（必填）；避免空模式
          path:
            type: string
            description: 搜索路径（可选）：须为 /skills/{skillId}/... 或 /workspace（含 /workspace/wt-xxx/...）；禁止 /skill
          glob:
            type: string
            description: 文件名 glob 过滤（可选）
        required:
          - pattern
      sandbox__exec:
        display-name: 执行命令
        description: 在沙箱容器内执行 shell（破坏性命令会被拒绝；只读命令通常免 HITL）
        properties:
          command:
            type: string
            description: shell 命令；禁止 rm -rf /、管道下载执行、mkfs 等破坏性操作
          cwd:
            type: string
            description: 工作目录（可选，默认 /workspace（含 /workspace/wt-xxx/...）；须在 /skills/{skillId}/... 或 /workspace）
          timeout_sec:
            type: integer
            description: 超时秒数（可选；同步默认约 30；background=true 且未传时与墙钟对齐，约 600）
          background:
            type: boolean
            description: 可选；true=立即返回 runId，主 Agent 用 await_tool_run 收结果；默认 false
        required:
          - command
      sandbox__webfetch:
        display-name: 抓取网页
        description: 获取指定 http/https URL 的网页正文（HTML 转纯文本；禁止内网地址；常用以核验搜索结果或读取文档）
        properties:
          url:
            type: string
            description: 目标 URL（仅 http/https；禁内网/本机/保留地址）
          max_chars:
            type: integer
            description: 返回正文最大字符数（可选，默认 200000）
        required:
          - url
      sandbox__websearch:
        display-name: 搜索网页
        description: 通过 Bing 搜索网页，返回标题 / URL / 摘要（通常随后用 webfetch 打开原文）
        properties:
          query:
            type: string
            description: 搜索关键词（建议中文/英文均可）
          count:
            type: integer
            description: 返回结果条数（可选，默认 5，最多 10）
        required:
          - query

  # routing.structural / routing.peer / routing.rules 已退役 → resource-manager Catalog
  # （routing-rule.*，见 docker/mysql/init/19-sunshine-resource.sql）
  # 验收提示词仍见 docs/routing/routing-golden-set.md；引擎 UnifiedRuleRoutingPolicy

  model:
    # name / context-window 已迁注册表；api-key 为 Gateway 代理鉴权占位
    api-key: sunshine-gateway
    base-url: http://sunshine-llm-gateway/v1
    max-tokens: 16384
  history:
    max-messages: 20
  generation:
    ttl-sec: 3600
    orphan-timeout-sec: 120
    max-buffer-chunks: 10000
    reconnect-block-ms: 5000
    flush-interval-ms: 500
    max-chunk-chars: 32
    max-stream-len: 20000
    lock:
      enabled: true
      ttl-sec: 30
      key-prefix: "sunshine:generation:lock:"
  pause:
    resume-interaction-enabled: true
  resume:
    auto-on-reload: true
    max-resume-attempts: 3
  grounding:
    enabled: true
    block-on-failure: true
    rejection-message: 答复包含未经验证的企业数据表述，请先调用知识库或业务工具后再作答。
  hitl:
    enabled: true
    workflow-node-recovery: true
    # timeout-sec<=0 = 无限等待，仅用户确认/取消/停止会话结束（验收需要可临时给 5）
    timeout-sec: 0
    rejection-message: 用户未确认执行该写操作，已跳过。
    # agent-prompt → Catalog id=hitl.agent-prompt

  title:
    enabled: true
    max-length: 15
    # model → scene=title；system-prompt → Catalog id=conversation.title

  context:
    enabled: true
    l1:
      # near/mid 按「问答轮次」计（一轮 = 1 次 user + 其后 assistant），非消息条数
      near-turns: 8
      mid-turns: 8
      # 压缩触发：真实 token 达模型上下文窗口 80% 才触发；轮次为宽限兜底
      max-tokens-ratio: 0.8
      turn-backstop: 40
      # 窗口来自注册表 ModelSceneResolver；禁止 default-model-window
      token-safety-factor: 1.1
      mid-compress-ratio: 0.15
      # 压缩点模式（五层 §5.5 / task-scene §4）：启用面 task×fast|pro；
      # Near 起点=far_folded_msg_ids 之后，溢出走「同步推进压缩点（零 LLM）」
      # 而非从近窗头部丢轮次；退役轮的 LLM 折叠由轮末写路径异步补（P/S 分离）
      compression-point:
        enabled: true
        # task 压缩后重组：Near 保底原文 2 轮 + Mid 摘要 2 轮（v15：2+2+Far）
        near-keep-rounds: 2
        mid-keep-rounds: 2
        # chat 压缩点二期（§5.5.7 差异表：4+4+Far，2026-08-26 启用）
        chat-near-keep-rounds: 4
        chat-mid-keep-rounds: 4
        # task 压缩后重组硬性总量预算（Near+Mid+Far，token；v15 ⑮）：
        # 超限先降级最旧 Mid 为折叠、再激进折叠最旧 Near（保底 1 轮）；≤0 关闭；
        # chat 无硬预算，靠组装侧 Budget 退役并入收敛
        task-post-compact-budget: 10000
    l2:
      min-confidence: 0.75
      constraint-overwrite-confidence: 0.9
      preference-ttl-days: 365
      agreement-ttl-days: 365
      goal-ttl-days: 90
      decision-ttl-days: 90
      fact-ttl-days: 30
      constraint-ttl-days: 30
      # 过程笔记（process_note，原 reasoning/option/interim_conclusion/topic 合并）
      process-note-min-confidence: 0.65
      process-note-ttl-days: 7
      todo-ttl-days: 7
      # §6.4 语义 merge：写路径语义冲突识别（关 → 回退纯字面快路径）
      semantic-merge-enabled: true
    l3:
      collection: sunshine_chat_history
      top-k: 8
      min-score: 0.45
      time-decay: true
      decay-half-life-days: 90
      # v26 L3 增强（§7.4）
      semantic-extract-enabled: true        # 嵌入前语义提取层开关
      body-gate-enabled: true               # v26.2 body 层非全量（仅 task 生效）：abstain 轮 body 原文也不落库；v28 chat 场景 body 原文层已退役，仅留 semantic 摘要
      semantic-batch-turns: 3               # 攒批触发轮数
      semantic-batch-interval-ms: 300000    # 攒批触发间隔 ms（定时兜底）
      semantic-dedupe-enabled: true         # 语义层入库去重开关
      dedupe-skip-threshold: 0.95           # cosine > 此值完全重复跳过
      dedupe-merge-threshold: 0.85          # 0.85~0.95 同义合并（保留旧条）
      process-layer-enabled: true           # task process 层（工具结果摘要）开关
      process-result-max-chars: 200         # process 层每条 result 截断字符数
    maintenance:
      interval-ms: 3600000
      superseded-retention-days: 180
      void-retention-days: 30
      audit-enabled: true
      audit-on-extract: true
      audit-max-users-per-tick: 50
      audit-extract-debounce-ms: 30000
      # v26 L3 过期清理分层 TTL（天；≤0 跳过对应层）
      l3-chat-ttl-days: 30
      l3-task-body-ttl-days: 90
      l3-task-process-ttl-days: 7
      l3-task-semantic-ttl-days: 90
  memory:
    # 仅 AutoContext（4.6.4）；跨轮上下文见 agent.context + Catalog context.*
    auto-context:
      enabled: true
      large-payload-threshold: 5120
      max-token: 262144
      token-ratio: 0.75
      offload-single-preview: 200
      # 方案 A：token 动态触发（trigger 依据 agent.model.context-window）
      msg-threshold: 0            # 0=禁用消息数触发，仅 token 触发
      last-keep: 12
      trigger-tokens: 0           # 0=动态：effectiveTrigger = contextWindow - reserved
      reserved: 20000             # 摘要过程 token 缓冲
      keep-tokens: -1             # -1=动态保留 tail（min/max/ratio）
      keep-tokens-min: 2000
      keep-tokens-max: 8000
      keep-tokens-ratio: 0.25
      flush-before-compact: false # 本工程 disableMemoryHooks，压缩前不做 LLM 记忆抽取
      offload-before-compact: true
      # 压缩摘要模板 SSOT：prompt-manager Catalog id=compaction.summary-prompt（勿在此配置）
      truncate-args-enabled: true
      truncate-args-max-chars: 2000
      prune-enabled: true
      prune-protect-tokens: 40000
      prune-min-tokens: 20000
      prune-max-output-chars: 2000
      min-consecutive-tool-messages: 4
      current-round-compression-ratio: 0.3
      min-compression-token-threshold: 3000
prompt-catalog:
  refresh-ms: 5000
desensitize:
  enabled: true

sunshine:
  audit:
    enabled: true
    topic: sunshine-audit
    consumer-group: sunshine-audit-consumer
    elasticsearch:
      enabled: true
      url: http://ecs4c16g:9200
      index: sunshine-audit
  llm-usage:
    # phase5 5.2 用量计量消费：topic=llm-usage，落库 llm_usage_record
    enabled: true
    topic: llm-usage
    consumer-group: sunshine-llm-usage-consumer
    # 5.2.3 日聚合任务（llm_usage_record → llm_usage_daily，删除重建幂等）
    aggregate-interval-ms: 300000
    aggregate-lookback-days: 2
    # 模型单价（元 / 1M tokens）：成本估算 est_cost；未配置模型估算为 0
    price:
      deepseek-v4-flash:
        input-per-1m: 2.0
        output-per-1m: 8.0
      qwen-plus:
        input-per-1m: 0.8
        output-per-1m: 2.0

rocketmq:
  producer:
    endpoints: ecs4c16g:8081
    topic: sunshine-audit
  push-consumer:
    endpoints: ecs4c16g:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: sunshine-orchestrator

# 公共模型 Catalog（无密钥）；gateway catalog 仅 llm-gateway 使用
resource-manager:
  base-url: http://sunshine-resource-manager

logging:
  level:
    com.sunshine: debug
