# 表结构 SSOT：docker/mysql/init/11-sunshine-orchestrator.sql（禁止 Flyway）
#
# 【4.11 迁出】提示词正文 / 路由规则 SSOT = prompt-manager DB（:8500 Catalog）
#   - routing-rule.* / system-prompt / mode-overlay.* / timeline.* / …
#   - 种子：docker/mysql/init/17-sunshine-prompt-manager.sql（含表结构 + 全量种子）
#   - 本文件 agent.* 仅留数值/开关；提示词正文勿再当运营 SSOT
#   - 运营入口：sunshine-ui `/prompts`；验收：scripts/verify_prompt_catalog_live.py

server:
  port: 8200

spring:
  datasource:
    url: jdbc:mysql://ecs4c16g:3306/sunshine_chat?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ecs4c16g
      port: 6379
      password: redis123

agent:
  # 提示词/时间线/改写正文已迁 prompt-manager Catalog
  # （docker/mysql/init/17-sunshine-prompt-manager.sql）
  # 运营入口：/prompts；禁止再在本文件维护提示词正文
  # system-prompt / mode-overlay.* / answer.* / timeline.* / planner.prompt → Catalog

  prompt:
    # skill overlay SSOT = skill-manager Catalog（无 Nacos 影子）

  intent:
    model: deepseek-v4-flash
    # classifier-prompt → Catalog id=intent.classifier

  planner:
    model: deepseek-v4-flash
    temperature: 0
    max_tokens: 4096
    max_nodes: 8
    routing_node_buffer: 6
    # prompt → Catalog id=planner.prompt（含拓扑约束；勿再写 topology-hints）

  # timeline.* → Catalog timeline.intent / timeline.steps.* / timeline.hitl / …（T9）

  execution:
    default-mode: react
    react:
      max-iters: 20
      taskboard:
        enabled: true
      subagent:
        enabled: true
        max-iters: 8
        timeout-ms: 180000
        # cancel-result → Catalog id=react.subagent.cancel-result
    plan-workflow:
      replan:
        max-attempts: 2
        # user-feedback-template → Catalog id=plan-workflow.replan-feedback
      planner:
        max-attempts: 2
        backoff-ms: 800
      # answer.upstream-failure-line → Catalog id=plan-workflow.upstream-failure-line
      fallback-react:
        enabled: true
        inject-partial-context: true
      approval:
        enabled: true
        timeout-sec: 600
        on-timeout: fallback_react
        max-user-rounds: 10
        # user-modification-template → Catalog id=plan-workflow.user-modification
  skill:
    # P1 强提示句式 — 须含命名组 skill；P0 @ 由 SkillBindingParser 硬编码
    hint-patterns:
      - "请使用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill"
      - "用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill\\s+处理"
      - "请用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill"

  # 对话级 Docker 沙箱（4.5 workspace 抽屉）
  # MAIN/SUB 常驻 sandbox__*；首次工具调用 / 抽屉 list 懒 create — docs/superpowers/specs/2026-07-16-conversation-sandbox-permanent-tools-design.md · SUB 默认见 2026-07-17-sub-agent-sandbox-default-design.md
  sandbox:
    conversation-ttl-sec: 1800
    purge-ttl-sec: 604800
    workspace-content-max-chars: 200000
    reaper-interval-ms: 60000
    cancellable-tools:
      - sandbox__exec
      - sandbox__grep
      - sandbox__glob
    cancel-max-followups: 3
    cancel-after: 已取消
    # cancel-result → Catalog id=sandbox.cancel-result
    # budget-exhausted → Catalog id=sandbox.budget-exhausted
    # idle 30min → docker stop；自上次活动 7d → rm+清盘 — docs/superpowers/specs/2026-07-17-sandbox-container-lifecycle-design.md
    runtime:
      image: sunshine-sandbox-python:3.11-slim
      runtime-type: docker
      timeout-sec: 30
      memory-mb: 256
      cpus: 0.5
      network-allow: []
      exec-readonly-allow:
        - "ls *"
        - "pwd"
        - "python -m pytest *"
    # 六工具 displayName / description / JSON Schema — TD-111 SSOT
    tools:
      sandbox__read:
        display-name: 读文件
        description: 读取沙箱内文本文件（/skills/{skillId}/... 或 /workspace；勿对目录调用）
        properties:
          path:
            type: string
            description: 文件路径（须 /skills/{skillId}/... 或 /workspace/...；禁止旧路径 /skill）
          offset:
            type: integer
            description: 起始行（可选）
          limit:
            type: integer
            description: 读取行数上限（可选）
        required:
          - path
      sandbox__write:
        display-name: 写文件
        description: 仅新建工作区文件（仅 /workspace；已存在则失败，请改用 edit 或换路径）
        properties:
          path:
            type: string
            description: 写入路径（仅 /workspace）；仅允许新建，禁止覆盖已有文件
          content:
            type: string
            description: 新建文件全文内容
        required:
          - path
          - content
      sandbox__edit:
        display-name: 编辑文件
        description: 精确替换已有工作区文件中的唯一子串（仅 /workspace）
        properties:
          path:
            type: string
            description: 已有文件路径（仅 /workspace）
          old_string:
            type: string
            description: 待替换的精确原文（须在文件中唯一出现）
          new_string:
            type: string
            description: 替换后的文本
        required:
          - path
          - old_string
          - new_string
      sandbox__glob:
        display-name: 查找文件
        description: 在沙箱 jail 内按 glob 查找文件路径（优先收窄 path/pattern）
        properties:
          pattern:
            type: string
            description: glob 模式，如 **/*.py；尽量收窄
          path:
            type: string
            description: 搜索根（可选）：须为 /skills/{skillId}/... 或 /workspace；禁止 /skill；缺省搜全部 jail
        required:
          - pattern
      sandbox__grep:
        display-name: 搜索内容
        description: 在沙箱 jail 内按正则搜索文件内容（须提供 pattern）
        properties:
          pattern:
            type: string
            description: 搜索正则（必填）；避免空模式
          path:
            type: string
            description: 搜索路径（可选）：须为 /skills/{skillId}/... 或 /workspace；禁止 /skill
          glob:
            type: string
            description: 文件名 glob 过滤（可选）
        required:
          - pattern
      sandbox__exec:
        display-name: 执行命令
        description: 在沙箱容器内执行 shell（破坏性命令会被拒绝；只读命令通常免 HITL）
        properties:
          command:
            type: string
            description: shell 命令；禁止 rm -rf /、管道下载执行、mkfs 等破坏性操作
          cwd:
            type: string
            description: 工作目录（可选，默认 /workspace；须在 /skills/{skillId}/... 或 /workspace）
          timeout_sec:
            type: integer
            description: 超时秒数（可选，默认 30）
        required:
          - command

  # routing.structural / routing.peer / routing.rules 已退役 → prompt-manager Catalog
  # （routing-rule.*，见 docker/mysql/init/17-sunshine-prompt-manager.sql）
  # 验收提示词仍见 docs/routing/routing-golden-set.md；引擎 UnifiedRuleRoutingPolicy

  # peer-collab 相关配置已退役；多智能体协作统一为 spawn_subagent 中心化编排
  # peer: { min-rounds, max-rounds } 等字段已移除
    # gather/speak/synthesis/round-* → Catalog peer.*

  # expert.coordinator/complexity → Catalog expert.*

  model:
    base-url: http://localhost:8300/v1
    name: deepseek-v4-pro
    api-key: sunshine-gateway
  history:
    max-messages: 20
  generation:
    ttl-sec: 3600
    orphan-timeout-sec: 120
    max-buffer-chunks: 10000
    reconnect-block-ms: 5000
    flush-interval-ms: 500
    max-chunk-chars: 32
    lock:
      enabled: true
      ttl-sec: 30
      key-prefix: "sunshine:generation:lock:"
  pause:
    resume-interaction-enabled: true
  resume:
    auto-on-reload: true
    max-resume-attempts: 3
  grounding:
    enabled: true
    block-on-failure: true
    rejection-message: 答复包含未经验证的企业数据表述，请先调用知识库或业务工具后再作答。
  hitl:
    enabled: true
    workflow-node-recovery: true
    timeout-sec: 120
    rejection-message: 用户未确认执行该写操作，已跳过。
    # agent-prompt → Catalog id=hitl.agent-prompt

  rewrite:
    intent:
      enabled: true
      model: deepseek-v4-flash
      max-chars: 8
      # system-prompt → Catalog id=rewrite.intent
    planner:
      enabled: true
      model: deepseek-v4-flash
      # system-prompt → Catalog id=rewrite.planner
    # timeline → Catalog id=rewrite.timeline

  context:
    enabled: true
    l1:
      # near/mid 按「问答轮次」计（一轮 = 1 次 user + 其后 assistant），非消息条数
      near-turns: 8
      mid-turns: 8
      # 压缩触发：真实 token 达模型上下文窗口 80% 才触发；轮次为宽限兜底
      max-tokens-ratio: 0.8
      turn-backstop: 40
      default-model-window: 128000
      token-safety-factor: 1.1
      mid-compress-ratio: 0.15
    l2:
      min-confidence: 0.75
      constraint-overwrite-confidence: 0.9
      preference-ttl-days: 365
      agreement-ttl-days: 365
      goal-ttl-days: 90
      decision-ttl-days: 90
      fact-ttl-days: 30
      constraint-ttl-days: 30
      # 过程记忆分级置信 + TTL
      reasoning-min-confidence: 0.7
      interim-conclusion-min-confidence: 0.6
      reasoning-ttl-days: 7
      option-ttl-days: 7
      interim-conclusion-ttl-days: 7
      topic-ttl-days: 1
    l3:
      collection: sunshine_chat_history
      top-k: 8
      min-score: 0.45
      time-decay: true
      decay-half-life-days: 90
    maintenance:
      interval-ms: 3600000
      superseded-retention-days: 180
      void-retention-days: 30
      audit-enabled: true
      audit-on-extract: true
      audit-max-users-per-tick: 50
      audit-extract-debounce-ms: 30000
  memory:
    # 仅 AutoContext（4.6.4）；跨轮上下文见 agent.context + Catalog context.*
    auto-context:
      enabled: true
      large-payload-threshold: 5120
      max-token: 131072
      token-ratio: 0.75
      offload-single-preview: 200
      msg-threshold: 40
      last-keep: 12
      min-consecutive-tool-messages: 4
      current-round-compression-ratio: 0.3
      min-compression-token-threshold: 3000
tool-manager:
  base-url: http://localhost:8210
skill-manager:
  base-url: http://localhost:8225
agent-manager:
  base-url: http://localhost:8235
workflow-manager:
  base-url: http://localhost:8230
sandbox-service:
  base-url: http://localhost:8226
prompt-manager:
  base-url: http://localhost:8500
prompt-catalog:
  refresh-ms: 5000
desensitize:
  enabled: true
  base-url: http://localhost:8600
rag:
  base-url: http://localhost:8400

sunshine:
  audit:
    enabled: true
    topic: sunshine-audit
    consumer-group: sunshine-audit-consumer
    elasticsearch:
      enabled: true
      url: http://ecs4c16g:9200
      index: sunshine-audit

rocketmq:
  producer:
    endpoints: ecs4c16g:8081
    topic: sunshine-audit
  push-consumer:
    endpoints: ecs4c16g:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: sunshine-orchestrator

logging:
  level:
    com.sunshine: debug
