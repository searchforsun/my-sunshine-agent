# 表结构 SSOT：docker/mysql/init/11-sunshine-orchestrator.sql（禁止 Flyway）
#
# 【4.11 迁出】提示词正文 / 路由规则 SSOT = prompt-manager DB（:8500 Catalog）
#   - routing-rule.* / system-prompt / mode-overlay.* / timeline.* / intent.classifier / …
#   - 种子：docker/mysql/init/17-sunshine-prompt-manager.sql + *-seed-prompts.sql
#   - 本文件 agent.system-prompt / agent.prompt.* / agent.routing.* 仅留占位或空壳，勿再当运营 SSOT
#   - 运营入口：sunshine-ui `/prompts`；验收：scripts/verify_prompt_catalog_live.py

server:
  port: 8200

spring:
  datasource:
    url: jdbc:mysql://ecs4c16g:3306/sunshine_chat?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ecs4c16g
      port: 6379
      password: redis123

agent:
  # 提示词/时间线/改写正文已迁 prompt-manager Catalog
  # （docker/mysql/init/17-sunshine-prompt-manager-seed-prompts.sql）
  # system-prompt → Catalog id=system-prompt（T8）
  system-prompt: ""

  prompt:
    # mode-overlays / scope / answer-* → Catalog（T8/T9）
    # mode-overlay.react|react-restart|subagent|workflow|direct
    # answer.template / answer.overlay / scope-prompt
    mode-overlays: {}
    skill-overlays: {}
    scope-prompt: ""
    answer-overlay: ""
    answer-template: ""

  intent:
    model: deepseek-v4-flash
    # classifier-prompt → Catalog id=intent.classifier

  planner:
    model: deepseek-v4-flash
    temperature: 0
    max_tokens: 4096
    max_nodes: 8
    routing_node_buffer: 6
    # prompt → Catalog id=planner.prompt
    topology-hints:
      rules:
        - id: parallel
          patterns: ["同时", "并行", "双路", "一并"]
          hint: |
            【须用 parallel-gateway】start→pg→≥2 分支 rag/tool→join。禁止串行 n1→n2 代替并行。
        - id: exclusive
          patterns: ["如果", "否则", "不满足"]
          hint: |
            【须用 exclusive-gateway】≥2 出边，恰好 1 条 default:true；其余带 condition。
        - id: loop
          patterns: ["继续", "循环", "多轮"]
          hint: |
            【须用 loop 容器】body 设 parentId=loopId；外图 edges 仅 start→loop。
            禁止 loop→body 跨框边；单 body 可省略框内 edges。

  # timeline.* → Catalog timeline.intent / timeline.steps.* / timeline.hitl / …（T9）

  execution:
    default-mode: react
    react:
      max-iters: 20
      taskboard:
        enabled: true
        max-items: 12
        max-in-progress: 1
        seed-from-injected-summary: true
        audit:
          sample-rate: 1.0
      subagent:
        enabled: true
        max-iters: 8
        timeout-ms: 180000
        cancel-result: |
          用户已取消子任务。请主 Agent 自行完成以下任务（勿再次 spawn 同一任务）：
          {prompt}
    plan-workflow:
      replan:
        max-attempts: 2
        user-feedback-template: |
          【Plan 校验失败 — 请修正后重输出一行 JSON】

          {{error}}

          【契约回顾】
          - type 仅 rag/tool/agent/parallel-gateway/join/exclusive-gateway/loop；勿 start/answer
          - loop：body 用 parentId；外图仅 start→loop；禁止 loop↔body 连边
          - parallel：pg→多分支→join；exclusive：恰好 1 条 default 出边
          - 末节点勿连 answer；params 键名 params；每节点 displayName
      planner:
        max-attempts: 2
        backoff-ms: 800
      answer:
        upstream-failure-line: "（{{displayName}} 执行失败：{{error}}，已尝试 {{attemptCount}} 次）"
      fallback-react:
        enabled: true
        inject-partial-context: true
      approval:
        enabled: true
        timeout-sec: 600
        on-timeout: fallback_react
        max-user-rounds: 10
        user-modification-template: |
          用户对当前执行计划的修改意见：{{hint}}
          请据此重新输出一行 Plan JSON。遵守 Planner 契约：type 仅 rag/tool/agent/parallel-gateway/join/exclusive-gateway/loop；勿 start/answer；loop 用 parentId 且禁止 loop↔body 跨框边；末节点勿连 answer。
  skill:
    # P1 强提示句式 — 须含命名组 skill；P0 @ 由 SkillBindingParser 硬编码
    hint-patterns:
      - "请使用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill"
      - "用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill\\s+处理"
      - "请用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill"

  # 对话级 Docker 沙箱（4.5 workspace 抽屉）
  # MAIN/SUB 常驻 sandbox__*；首次工具调用 / 抽屉 list 懒 create — docs/superpowers/specs/2026-07-16-conversation-sandbox-permanent-tools-design.md · SUB 默认见 2026-07-17-sub-agent-sandbox-default-design.md
  sandbox:
    conversation-ttl-sec: 1800
    purge-ttl-sec: 604800
    workspace-content-max-chars: 200000
    reaper-interval-ms: 60000
    cancellable-tools:
      - sandbox__exec
      - sandbox__grep
      - sandbox__glob
    cancel-max-followups: 3
    cancel-after: 已取消
    cancel-result: |
      用户已取消该沙箱工具调用。请换方案继续（勿重复同一命令）。原参数：{params}。本轮同族还可再调用 {remaining} 次。
    budget-exhausted: |
      本轮用户取消后同族沙箱工具调用次数已用尽，请直接作答或改用其它能力。
    # idle 30min → docker stop；自上次活动 7d → rm+清盘 — docs/superpowers/specs/2026-07-17-sandbox-container-lifecycle-design.md
    runtime:
      image: sunshine-sandbox-python:3.11-slim
      runtime-type: docker
      timeout-sec: 30
      memory-mb: 256
      cpus: 0.5
      network-allow: []
      exec-readonly-allow:
        - "ls *"
        - "pwd"
        - "python -m pytest *"
    # 六工具 displayName / description / JSON Schema — TD-111 SSOT
    tools:
      sandbox__read:
        display-name: 读文件
        description: 读取沙箱内文本文件（/skills/{skillId}/... 或 /workspace；勿对目录调用）
        properties:
          path:
            type: string
            description: 文件路径（须 /skills/{skillId}/... 或 /workspace/...；禁止旧路径 /skill）
          offset:
            type: integer
            description: 起始行（可选）
          limit:
            type: integer
            description: 读取行数上限（可选）
        required:
          - path
      sandbox__write:
        display-name: 写文件
        description: 仅新建工作区文件（仅 /workspace；已存在则失败，请改用 edit 或换路径）
        properties:
          path:
            type: string
            description: 写入路径（仅 /workspace）；仅允许新建，禁止覆盖已有文件
          content:
            type: string
            description: 新建文件全文内容
        required:
          - path
          - content
      sandbox__edit:
        display-name: 编辑文件
        description: 精确替换已有工作区文件中的唯一子串（仅 /workspace）
        properties:
          path:
            type: string
            description: 已有文件路径（仅 /workspace）
          old_string:
            type: string
            description: 待替换的精确原文（须在文件中唯一出现）
          new_string:
            type: string
            description: 替换后的文本
        required:
          - path
          - old_string
          - new_string
      sandbox__glob:
        display-name: 查找文件
        description: 在沙箱 jail 内按 glob 查找文件路径（优先收窄 path/pattern）
        properties:
          pattern:
            type: string
            description: glob 模式，如 **/*.py；尽量收窄
          path:
            type: string
            description: 搜索根（可选）：须为 /skills/{skillId}/... 或 /workspace；禁止 /skill；缺省搜全部 jail
        required:
          - pattern
      sandbox__grep:
        display-name: 搜索内容
        description: 在沙箱 jail 内按正则搜索文件内容（须提供 pattern）
        properties:
          pattern:
            type: string
            description: 搜索正则（必填）；避免空模式
          path:
            type: string
            description: 搜索路径（可选）：须为 /skills/{skillId}/... 或 /workspace；禁止 /skill
          glob:
            type: string
            description: 文件名 glob 过滤（可选）
        required:
          - pattern
      sandbox__exec:
        display-name: 执行命令
        description: 在沙箱容器内执行 shell（破坏性命令会被拒绝；只读命令通常免 HITL）
        properties:
          command:
            type: string
            description: shell 命令；禁止 rm -rf /、管道下载执行、mkfs 等破坏性操作
          cwd:
            type: string
            description: 工作目录（可选，默认 /workspace；须在 /skills/{skillId}/... 或 /workspace）
          timeout_sec:
            type: integer
            description: 超时秒数（可选，默认 30）
        required:
          - command

  # routing.structural / routing.peer / routing.rules 已退役 → prompt-manager Catalog
  # （routing-rule.*，见 docker/mysql/init/17-sunshine-prompt-manager.sql）
  # 验收提示词仍见 docs/routing/routing-golden-set.md；引擎 UnifiedRuleRoutingPolicy

  peer:
    min-rounds: 1
    max-rounds: 3
    gather-instruction: |
      你当前处于多专家协作的工具检索阶段。请调用必要工具收集事实与数据，并在最终回复中仅输出结构化的检索摘要（要点列表），勿撰写面向用户的完整发言稿。后续引擎将根据摘要生成正式发言。
    speak-prompt: |
      你是 {expertName}，正在参与多专家讨论。

      用户问题：
      {userQuery}

      讨论上下文：
      {transcript}

      工具与检索材料：
      {gatheredContext}

      请以 {expertName} 身份向讨论组发表专业观点（Markdown），仅依据上述材料，勿编造。
    synthesis-prompt: |
      用户问题：{userQuery}

      上游数据：
      {transcript}

      请严格针对上述「用户问题」作答：仅依据上游数据回答用户所问。使用 Markdown；加粗标记须成对。
    round-continue-prompt: |
      你是多专家讨论轮次协调助手。根据用户问题与当前讨论记录，判断是否还需下一轮专家发言。
      若观点已收敛、无新事实待查、无未回应质疑，则 continue=false；若仍存在分歧、缺材料或未回应的质疑，则 continue=true。
      只输出 JSON：{"continue":true或false,"reason":"一句话说明"}，不要 markdown。
    round-speakers-prompt: |
      你是多专家讨论发言调度助手。第 1 轮全员已发言；请从候选专家中选出第 2 轮及以后仍需发言的人：
      仅包含对其它观点有异议、需补充材料、或尚未回应关键质疑的专家；无异议者不要选。
      若无人需要再发言，输出空数组 expertIds:[]。
      只输出 JSON：{"expertIds":["id1"],"reason":"一句话说明"}，不要 markdown。

  expert:
    coordinator-prompt: |
      你是多专家协作召集助手。根据用户问题，从候选专家目录中选择 2~4 位最相关的专家，并估计讨论轮次上限。
      轮次含义：1=简单事实核对；2=需交叉验证；3=多观点分歧需多轮质疑。不得超过全局 maxRounds（当前 3）。
      只输出 JSON：{"expertIds":["id1","id2"],"maxRounds":2,"reason":"一句话说明"}，不要 markdown。
    complexity-prompt: |
      你是多专家协作轮次评估助手。用户已显式指定专家名单，请根据问题复杂度估计 Hub 讨论轮次上限（整数）。
      1=简单事实核对；2=需交叉验证；3=多观点分歧需多轮质疑。不得超过用户消息中的全局上限。
      只输出 JSON：{"maxRounds":1,"reason":"一句话说明"}，不要 markdown。

  model:
    base-url: http://localhost:8300/v1
    name: deepseek-v4-pro
    api-key: sunshine-gateway
  history:
    max-messages: 20
  generation:
    ttl-sec: 3600
    orphan-timeout-sec: 120
    max-buffer-chunks: 10000
    reconnect-block-ms: 5000
    flush-interval-ms: 500
    max-chunk-chars: 32
    lock:
      enabled: true
      ttl-sec: 30
      key-prefix: "sunshine:generation:lock:"
  pause:
    resume-interaction-enabled: true
  resume:
    auto-on-reload: true
    max-resume-attempts: 3
  grounding:
    enabled: true
    block-on-failure: true
    rejection-message: 答复包含未经验证的企业数据表述，请先调用知识库或业务工具后再作答。
  hitl:
    enabled: true
    workflow-node-recovery: true
    timeout-sec: 120
    rejection-message: 用户未确认执行该写操作，已跳过。
    # agent-prompt → Catalog id=hitl.agent-prompt

  rewrite:
    intent:
      enabled: true
      model: deepseek-v4-flash
      max-chars: 8
      # system-prompt → Catalog id=rewrite.intent
    planner:
      enabled: true
      model: deepseek-v4-flash
      # system-prompt → Catalog id=rewrite.planner
    # timeline → Catalog id=rewrite.timeline

  memory:
    enabled: true
    layer-prompt: |
      记忆分层：LTM/MTM 为摘要，STM 为同会话已结束轮次（仅供指代）。
      **仅执行并回答**带「【当前提问 · 仅此作答】」标记的用户消息。
    current-user-marker: "【当前提问 · 仅此作答】"
    stm:
      redis-ttl-hours: 24
      max-messages: 12
      max-chars: 8000
      header: "[本会话近期对话 · STM]"
      preamble: |
        以下为同会话已结束轮次，仅供指代与消歧（如「这个 skill」「上述脚本」）。
    mtm:
      enabled: true
      top-k: 3
      min-score: 0.55
      summarize-prompt: |
        你是企业对话摘要助手。根据以下会话 transcript，输出 2~4 句中文摘要。
        只保留事实：用户问了什么、助手答了什么、是否涉及工具/业务。
        只输出摘要正文，不要标题或 markdown。
    ltm:
      enabled: true
      max-chars: 500
    # 4.6.4 ReAct 单次 run 内 TOOL 上下文压缩（AgentScope AutoContextMemory）
    auto-context:
      enabled: true
      large-payload-threshold: 5120
      max-token: 131072
      token-ratio: 0.75
      offload-single-preview: 200
      msg-threshold: 40
      last-keep: 12
      min-consecutive-tool-messages: 4
      current-round-compression-ratio: 0.3
      min-compression-token-threshold: 3000
tool-manager:
  base-url: http://localhost:8210
skill-manager:
  base-url: http://localhost:8225
expert-manager:
  base-url: http://localhost:8235
workflow-manager:
  base-url: http://localhost:8230
sandbox-service:
  base-url: http://localhost:8226
prompt-manager:
  base-url: http://localhost:8500
prompt-catalog:
  refresh-ms: 5000
desensitize:
  enabled: true
  base-url: http://localhost:8600
rag:
  base-url: http://localhost:8400

sunshine:
  audit:
    enabled: true
    topic: sunshine-audit
    consumer-group: sunshine-audit-consumer
    elasticsearch:
      enabled: true
      url: http://ecs4c16g:9200
      index: sunshine-audit

rocketmq:
  producer:
    endpoints: ecs4c16g:8081
    topic: sunshine-audit
  push-consumer:
    endpoints: ecs4c16g:8081

logging:
  level:
    com.sunshine: debug
