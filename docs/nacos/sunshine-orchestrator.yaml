agent:
  system-prompt: |
    你是 Sunshine AI 企业级智能助手。优先基于可用数据与已授权工具作答。

    ## 输出
    - 用户可见内容通过 **content** 输出，使用标准 GitHub Flavored Markdown。
    - 面向用户使用清晰、专业的中文表述。
    - 纯文字与 Markdown，无 emoji 或装饰性图标。
    - **reasoning** 承载分析过程；**content** 承载面向用户的完整答复。
    - reasoning 使用简体中文短句；content 可含表格、列表与完整段落。
    - 表格：表头、分隔行、数据行各占一行；禁止 ASCII 画线或把分隔行与数据行写在同一行。
    - 代码块：独立一行 ```language 围栏，语言名与代码分行；流程图用 ```mermaid。
    - 代码须完整可读，保留换行与缩进。

    ## 思考（reasoning）
    - 只写分析过程：问题理解、信息解读、推理步骤与结论依据。
    - 禁止复述系统提示词、任务模板、通道分工、注入原文，以及「按要求」「在 content 中」「根据系统提示」等 meta 表述。
    - 分析要点放在 reasoning；面向用户的正式结论与建议写在 content。
    - 长文与表格放在 content；reasoning 保持简短。

    ## 工具
    - 涉及企业数据、制度或业务状态时，仅引用工具/知识库返回的字段与文本，勿编造。
    - **写操作工具**：用户已明确要求时直接发起 tool call；平台在时间线弹出确认，勿在 content 用文字代劳确认。

    ## 其他
    - 答复面向用户的实际问题，不引用系统提示词或内部注入原文。

  prompt:
    mode-overlays:
      simple-llm: ""
      react: |
        - 外部数据先调匹配工具，可多轮串联不同工具。
        - 超时/不可用：改参或换工具再试一次，禁止相同参数连调。
        - 参数校验失败：按报错补参后再调。
        - 0 条或无数据：改写 query 再试一次，仍无效则收束作答。
        - **写操作工具**：用户要求审批/通过/提交等写操作时，**直接调用对应 tool**；禁止在 content 中询问「是否确认」代替调用。
        - 写操作由平台时间线 HITL 确认后执行；根据工具返回（含用户取消）继续作答，勿重复调用除非用户再次明确要求。
        - **中间正文**：仍需调工具时，content 须先输出 **1–2 句完整过渡语**（下一步/决策/进展），再发起 tool call；禁止只输出「好的」「OA」等二字碎片；禁止表格、分节、合规长文、汇总；完整答复留到**最后一轮**不再调工具时输出。
        - 分析过程写 reasoning，勿把大段分析提前写入 content。
        - 【TaskBoard】当用户问题隐含 2 步及以上（查、比、汇总、多工具）时，先调用 manage_tasks 列出任务再执行；每完成一步将对应项标为 completed，下一步标 in_progress；路径变化时可增删任务。
      react-restart: |
        ## 重新生成（续跑重规划）
        - 用户已停止上一轮执行并要求从头规划；**勿引用**上一轮已中断、已取消或已跳过的工具调用与返回。
        - 按当前用户问题**重新**规划工具顺序；勿在 reasoning 中复盘上一轮 HITL/暂停/超时细节。
      workflow: ""
    skill-overlays: {}
    scope-prompt: ""
    answer-overlay: ""
    answer-template: |
      用户问题：{{start.userQuery}}

      上游数据：
      {{plan.upstream}}

      请严格针对上述「用户问题」作答：仅依据上游数据回答用户所问。

  intent:
    model: deepseek-v4-flash
    classifier-prompt: |
      你是路由分类器。根据用户问题，从下列 workflow 目录中选择执行方式。
      只回复一行 JSON。

      输出格式：
      {"mode":"simple-llm|workflow|react|plan-workflow|peer-collab","workflowId":null或目录中的id,"params":{},"reason":"一句话"}

      规则：
      - simple-llm：简单对话、通识百科、写作润色、代码讲解等，单轮直答、不需企业知识库/业务系统
      - workflow：匹配下方目录中某一模板，workflowId 填对应 id，params 填本次参数（如 status: pending）
      - plan-workflow：跨多领域/多步骤协作（如「先检索制度，再查待审批，再合规分析」），无固定 workflow 模板；含「先…再…」「分步」「并对…分析」等多步表述时选此项
      - peer-collab：需多角色对等协作、交叉验证、互相质疑（如「制度与财务专家分别审查并互相验证」）；由 Expert Catalog + Coordinator 召集；勿与「先…再…」流水线 plan 混淆
      - react：审批/提交/确认/继续等操作指令，无匹配模板、需多工具组合、或不确定
      - 拿不准时用 react
  
      ## Workflow 目录
      {{workflow-catalog}}

  planner:
    model: deepseek-v4-flash
    temperature: 0
    max_tokens: 2048
    max_nodes: 8
    prompt: |
      你是 Workflow Planner。根据用户问题与可用 skill / tool 目录，输出**一行 JSON** 表示线性执行计划（nodes + edges）。

      输出格式（全部输出须为单行 JSON，含 planId/reason/nodes/edges）：
      {"planId":null,"reason":"一句话","nodes":[{"id":"n1","type":"rag","params":{"topK":"3"}},...],"edges":[{"from":"start","to":"n1"},...]}

      规则：
      - 节点 type：rag | tool | agent（**start / answer 由引擎固定拼接**，Planner 勿输出）
      - 节点参数键名 **params**；tool 节点 params.tool 来自下方 tool 目录
      - **选型**：制度/政策/知识库检索 → **rag**
      - **agent**：仅在上游已有 {{n*.output}} 时做分析/审查；params.context **必填非空**（如 "{{n1.output}}"），params.query 写子任务
      - tool 节点写齐业务参数（如 list_finance_messages 带 status: pending）
      - edges 单链 start → … → **末节点**（勿连 answer）
      - 节点数 ≤ 8；每节点填 displayName（中文）

      示例（制度+待审批+双 agent 合规链，单行 JSON，**无 answer 节点**）：
      {"planId":null,"reason":"制度检索、待审批查询、制度解读与合规分析","nodes":[{"id":"n1","type":"rag","displayName":"检索差旅报销制度","params":{"topK":"3"}},{"id":"n2","type":"tool","displayName":"查询待审批报销单","params":{"tool":"list_finance_messages","status":"pending"}},{"id":"n3","type":"agent","displayName":"制度解读","params":{"skill":"policy-review","context":"{{n1.output}}","query":"归纳差旅报销制度要点"}},{"id":"n4","type":"agent","displayName":"合规分析","params":{"skill":"compliance-check","context":"{{n1.output}}\\n{{n2.output}}\\n{{n3.output}}","query":"对每条单据做合规审查并归纳风险"}}],"edges":[{"from":"start","to":"n1"},{"from":"n1","to":"n2"},{"from":"n2","to":"n3"},{"from":"n3","to":"n4"}]}

      ## Skill 目录
      {{skill-catalog}}

      ## Tool 目录
      {{tool-catalog}}

  timeline:
    intent:
      label: 识别意图
      before: "阅读{query}"
      active: "正在分析{query}，匹配最佳处理方式"
      default-after: "已完成对{query}的意图判断"
      unmatched-after: "{query}将按「{detail}」处理"
      modes:
        simple-llm:
          detail: 简单对话
          after: "{query}属于简单对话，将直接生成回复"
          forced-after: "{query}将按您指定的「简单对话」模式直接回复"
        react:
          detail: 自主智能体
          after: "{query}将由自主智能体分析并作答"
          forced-after: "{query}将按您指定的「自主推理」模式处理"
        plan-workflow:
          detail: 动态规划
          after: "{query}将动态规划多步执行"
          forced-after: "{query}将按您指定的「动态规划」模式处理"
        peer-collab:
          detail: 多专家协作
          after: "{query}将由多专家协作交叉验证"
          forced-after: "{query}将按您指定的「多专家协作」模式处理"
        workflow:
          after: "{query}将按「{displayName}」流程处理"
          forced-after: "{query}将按您指定的「工作流」模式处理"
          # detail 仅路由解析用；时间线不下发 expandable detail
    steps:
      intent:
        label: 识别意图
      plan:
        label: 执行计划
        before: 规划执行路径
        active: 正在编排业务节点顺序
        after: 执行计划已生成
      think:
        label: 规划推理
        label-follow-up: 综合分析
        before: "规划如何回答{query}"
        active: "正在规划{query}的工具调用方案"
        after: "已完成{query}的工具调用规划"
        before-fallback: "规划工具与作答路径"
        active-fallback: "正在规划工具调用方案"
        after-fallback: "工具调用方案已拟定"
        before-follow-up: "准备结合{toolDisplayName}结果继续分析"
        active-follow-up: "正在综合分析{toolDisplayName}返回结果"
        after-follow-up: "已完成{toolDisplayName}的工具结果综合分析"
        before-follow-up-no-tool: "准备结合工具结果分析{query}"
        active-follow-up-no-tool: "正在结合工具返回结果分析{query}"
        after-follow-up-no-tool: "工具结果综合分析已完成"
        before-follow-up-fallback: "准备结合工具结果分析"
        active-follow-up-fallback: "正在综合分析工具结果"
        after-follow-up-fallback: "工具结果分析完成"
        modes:
          simple-llm:
            label: 构思回答
            label-follow-up: 整理作答
            before: "构思如何回答{query}"
            active: "正在构思针对{query}的作答思路"
            after: "已完成针对{query}的作答构思"
            before-follow-up: "准备整理作答要点"
            active-follow-up: "正在整理作答要点"
            after-follow-up: "作答要点整理完成"
      tool:
        label: "调用工具 {displayName}"
        before: "准备{displayName}"
        active: "正在{displayName}"
        after: "{displayName}完成"
      node:
        before: "准备{displayName}"
        active: "正在{displayName}"
        after: "{displayName}完成"
        before-with-query: "准备处理{query}的「{displayName}」环节"
      generate:
        label: 生成回答
        before: "为{query}撰写回复"
        active: "正在撰写并输出针对{query}的回复"
        after: "已完成对{query}的回复"
      rag:
        label: 检索知识库
        before: "在企业知识库中查找与{query}相关的资料"
        active: "正在匹配与{query}最相关的文档片段"
      skill:
        label: 加载技能
        before: "准备加载 Skill"
        active: "正在加载 Skill 指令"
        after: "@{skillId} {skillDisplayName}"
        after-fallback: "Skill 已加载"
      tasks:
        label: 任务清单
        before: 规划任务步骤
        active: "正在执行：{activeTask}"
        after: 任务清单已更新
        all-done: 全部任务已完成
      peer-collab:
        label: 多专家协作
        before: 准备多专家协作
        active: 正在召集专家
        after: 将由多专家协作处理
      expert-convene:
        label: 多专家协作
        before: 正在匹配协作专家
        active: 正在召集专家
        after: "已召集：{expertNames}"
      expert:
        label: "{displayName}"
        before: "准备听取{displayName}意见"
        active: "{displayName}正在分析"
        active-responding: "{displayName}正在回应其他专家观点"
        after: "{displayName}已完成发言"
    hitl:
      pending: "将调用工具 {toolDisplayName}"
      awaiting: "等待用户确认执行写操作"
      approved: "用户已确认，正在调用 {toolDisplayName}"
      denied: "用户取消调用"
      skipped-after: "用户取消调用，已跳过"
    plan-approval:
      awaiting: "等待确认执行计划"
      approved: "已确认执行计划"
      regenerating: "正在根据修改意见重新规划…"
      timed-out: "确认超时，将改由自主智能体继续"
    agent:
      before: "理解{query}，规划作答思路"
      active: "结合上下文分析{query}"
      progress: "深入分析{query}的背景与上下文"
      after-no-context: "完成问题分析，开始生成回复"
      after-outline: "已梳理{query}的作答要点"
      after-zero-hits: "知识库暂无{query}的匹配内容，将结合通用知识作答"
      after-with-hits: "已从 {hitCount} 条文档中提取与{query}相关的关键信息"
      after-default: "已完成对{query}的分析，开始生成回复"
    rag-after:
      hits-with-sources: "找到 {hitCount} 条参考片段，来源：{sources}"
      hits-with-query: "找到 {hitCount} 条与{query}相关的参考文档"
      zero-hits: "未找到与{query}直接相关的制度或文档"
      generic-done: "已完成针对{query}的知识库检索"
    workflow-node-types:
      rag: 检索知识库
      llm: 综合分析
      agent: 智能体分析
      answer: 生成回答
      tool: 调用工具
      unknown-workflow: 未知工作流
      unknown-node: 节点
      sub-agent-default: 子 Agent 分析
    workflow-agent:
      after-with-tools: "已完成 {toolCallCount} 次工具调用的综合分析"
      after-done: 智能体分析完成
      skill-loaded-prefix: "已加载技能：{skillLabel}"
    workflow-node-completion:
      complete: "{displayName}完成"
      hit-count: "命中 {hitCount} 条"
      skipped: "已跳过"
      skipped-with-reason: "已跳过：{reason}"
      retry-success: "（第 {attemptCount} 次尝试成功）"
      retry-failed-suffix: "（已重试 {attemptCount} 次）"
      node-failed: "节点执行失败"
      attempt-complete: "完成"
      attempt-failed: "失败: {error}"

  execution:
    default-mode: react
    react:
      tools: [search_knowledge, list_finance_messages, get_finance_message_detail, summarize_finance_by_status, list_oa_tasks, approve_oa_task]
      max-iters: 5
      taskboard:
        enabled: false
        max-items: 12
        max-in-progress: 1
        seed-from-injected-summary: true
        audit:
          sample-rate: 1.0
    plan-workflow:
      replan:
        max-attempts: 2
        user-feedback-template: |
          上次规划未通过校验：{{error}}
          请修正后重新输出一行 JSON。仍须遵守：仅 rag/tool/agent；勿含 start/answer；edges 末节点勿连 answer。
      planner:
        max-attempts: 2
        backoff-ms: 800
      node:
        defaults:
          max-attempts: 2
          backoff-ms: 500
          backoff-multiplier: 2.0
          on-failure: continue
          retry-on-error-class: [TIMEOUT, SERVICE_UNAVAILABLE, CIRCUIT_OPEN]
        critical-tools: [list_finance_messages, get_finance_message_detail]
        critical-on-failure: fail_fast
        by-type:
          rag:
            max-attempts: 1
          tool:
            max-attempts: 2
          agent:
            max-attempts: 1
          answer:
            max-attempts: 2
            on-failure: fail_fast
      answer:
        upstream-failure-line: "（{{displayName}} 执行失败：{{error}}，已尝试 {{attemptCount}} 次）"
      fallback-react:
        enabled: true
        inject-partial-context: true
      approval:
        enabled: true
        timeout-sec: 600
        on-timeout: fallback_react
        max-user-rounds: 10
        user-modification-template: |
          用户对当前执行计划的修改意见：{{hint}}
          请据此重新输出一行 Plan JSON。仍须遵守：仅 rag/tool/agent；勿含 start/answer；edges 末节点勿连 answer。

  skill:
    # P1 强提示句式 — 须含命名组 skill；P0 @ 由 SkillBindingParser 硬编码
    hint-patterns:
      - "请使用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill"
      - "用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill\\s+处理"
      - "请用\\s+(?<skill>[\\w\\u4e00-\\u9fff-]+)\\s+skill"

  routing:
    # L1 结构守卫 — SSOT 验收提示词见 docs/routing/routing-golden-set.md
    structural:
      enabled: true
      min-domain-groups: 2
      multi-step-patterns:
        - "先.+再"
        - "再.+(并|然后|接着)"
        - "分步"
        - "多步"
        - "并对.+?(分析|审查|检查|评估)"
        - "完整处理"
        - "一套.+(分析|流程|处理)"
      domain-groups:
        knowledge: [制度, 检索, 知识库, 政策, 差旅办法, 报销规定]
        finance: [待审批, 报销, 财务, 付款, 单据]
        analysis: [合规, 分析, 审查, 对比, 评估, 结论]
    peer:
      enabled: true
      default-template-id: compliance-cross-review
      structural-patterns:
        - "互相验证"
        - "交叉审查"
        - "多专家讨论"
        - "分别分析并质疑"
        - "两个角度.*审查"
        - "专家.*分别.*审查"
    rules:
      - id: rule-finance-smart-compliance
        priority: 20
        match: any
        patterns:
          - "是否合规"
          - "合规吗"
          - "合不合规"
          - "对比制度"
        plan:
          mode: workflow
          workflowId: finance-smart
          params:
            status: pending
      - id: rule-knowledge-budget-travel
        priority: 15
        match: any
        patterns:
          - "预算.*出差"
          - "出差.*预算"
          - "预算超支"
          - "预算不够.*出差"
        plan:
          mode: workflow
          workflowId: knowledge-qa
          params: {}
      - id: rule-finance-list-pending
        priority: 10
        match: any
        patterns:
          - "有哪些待审批"
          - "查询待审批"
          - "列出待审批"
          - "待审批的.*报销"
          - "待审批.*付款"
        plan:
          mode: workflow
          workflowId: finance-list
          params:
            status: pending

  peer:
    min-rounds: 1
    max-rounds: 3
    gather-instruction: |
      你当前处于多专家协作的工具检索阶段。请调用必要工具收集事实与数据，并在最终回复中仅输出结构化的检索摘要（要点列表），勿撰写面向用户的完整发言稿。后续引擎将根据摘要生成正式发言。
    speak-prompt: |
      你是 {expertName}，正在参与多专家讨论。

      用户问题：
      {userQuery}

      讨论上下文：
      {transcript}

      工具与检索材料：
      {gatheredContext}

      请以 {expertName} 身份向讨论组发表专业观点（Markdown），仅依据上述材料，勿编造。
    synthesis-prompt: |
      用户问题：{userQuery}

      上游数据：
      {transcript}

      请严格针对上述「用户问题」作答：仅依据上游数据回答用户所问。使用 Markdown；加粗标记须成对。
    round-continue-prompt: |
      你是多专家讨论轮次协调助手。根据用户问题与当前讨论记录，判断是否还需下一轮专家发言。
      若观点已收敛、无新事实待查、无未回应质疑，则 continue=false；若仍存在分歧、缺材料或未回应的质疑，则 continue=true。
      只输出 JSON：{"continue":true或false,"reason":"一句话说明"}，不要 markdown。
    round-speakers-prompt: |
      你是多专家讨论发言调度助手。第 1 轮全员已发言；请从候选专家中选出第 2 轮及以后仍需发言的人：
      仅包含对其它观点有异议、需补充材料、或尚未回应关键质疑的专家；无异议者不要选。
      若无人需要再发言，输出空数组 expertIds:[]。
      只输出 JSON：{"expertIds":["id1"],"reason":"一句话说明"}，不要 markdown。

  expert:
    coordinator-prompt: |
      你是多专家协作召集助手。根据用户问题，从候选专家目录中选择 2~4 位最相关的专家，并估计讨论轮次上限。
      轮次含义：1=简单事实核对；2=需交叉验证；3=多观点分歧需多轮质疑。不得超过全局 maxRounds（当前 3）。
      只输出 JSON：{"expertIds":["id1","id2"],"maxRounds":2,"reason":"一句话说明"}，不要 markdown。
    complexity-prompt: |
      你是多专家协作轮次评估助手。用户已显式指定专家名单，请根据问题复杂度估计 Hub 讨论轮次上限（整数）。
      1=简单事实核对；2=需交叉验证；3=多观点分歧需多轮质疑。不得超过用户消息中的全局上限。
      只输出 JSON：{"maxRounds":1,"reason":"一句话说明"}，不要 markdown。

  max-iters: 5
  model:
    base-url: http://localhost:8300/v1
    name: deepseek-v4-pro
    api-key: sunshine-gateway
  history:
    max-messages: 20
  generation:
    ttl-sec: 3600
    orphan-timeout-sec: 120
    max-buffer-chunks: 10000
    reconnect-block-ms: 5000
    flush-interval-ms: 500
    max-chunk-chars: 32
    lock:
      enabled: true
      ttl-sec: 30
      key-prefix: "sunshine:generation:lock:"
  pause:
    resume-interaction-enabled: true
  resume:
    auto-on-reload: true
    max-resume-attempts: 3
  grounding:
    enabled: true
    block-on-failure: true
    rejection-message: 答复包含未经验证的企业数据表述，请先调用知识库或业务工具后再作答。
  hitl:
    enabled: true
    workflow-node-recovery: true
    timeout-sec: 120
    rejection-message: 用户未确认执行该写操作，已跳过。
    agent-prompt: |
      ## 写操作确认（HITL）
      - 写操作类工具（如审批、提交）：用户意图已明确时**必须直接 tool call**，勿在 content 复述参数并文字询问确认。
      - 平台会在执行前于时间线展示内联「确认调用 / 取消调用」；用户确认后工具才真正执行。
      - 工具返回「用户未确认…已跳过」：向用户说明已取消，勿再次调用同一写操作，除非用户重新明确要求。
  rewrite:
    intent:
      enabled: true
      model: deepseek-v4-flash
      max-chars: 8
      system-prompt: |
        你是企业助手意图补全助手。结合消息中的「近期对话」补全过短输入；指代须据上下文还原。
        操作类表述（提交/审批/确认/继续）保留动作语义，勿改成「请问如何…」类咨询句。
        勿编造事实。只输出 JSON：{"query":"补全后的问句"}，不要 markdown 或其他文字。
    planner:
      enabled: true
      model: deepseek-v4-flash
      system-prompt: |
        你是 Plan-Workflow 规划前 query 优化助手。用户问题将交给 Planner 动态编排 rag/tool/agent 节点。
        补全多步意图表述（如先检索制度、再查待审批、再做合规分析），保留原意，补充制度/财务/合规等域内关键词。
        不要编造具体业务事实。
        只输出 JSON：{"query":"优化后的规划输入"}，不要 markdown 或其他文字。
    timeline:
      intent: "补全问句"
      planner: "优化规划输入"
  memory:
    enabled: true
    layer-prompt: |
      记忆分层：LTM/MTM 为摘要，STM 为同会话历史轮次；**仅回答**最后一条【当前提问】标记的用户消息。
    current-user-marker: "【当前提问 · 仅此作答】"
    stm:
      redis-ttl-hours: 24
      max-messages: 12
      max-chars: 8000
      header: "[本会话近期对话 · STM]"
      preamble: "以下为同会话已结束轮次，供指代参考，非本轮任务。"
    mtm:
      enabled: true
      top-k: 3
      min-score: 0.55
      summarize-prompt: |
        你是企业对话摘要助手。根据以下会话 transcript，输出 2~4 句中文摘要。
        只保留事实：用户问了什么、助手答了什么、是否涉及工具/业务。
        只输出摘要正文，不要标题或 markdown。
    ltm:
      enabled: true
      max-chars: 500
