      active: "正在分析{query}，匹配最佳处理方式"
      default-after: "已完成对{query}的意图判断"
      unmatched-after: "{query}将按「{detail}」处理"
      modes:
        react:
          detail: 自主智能体
          after: "{query}将由自主智能体分析并作答"
          forced-after: "{query}将按您指定的「自主推理」模式处理"
        plan-workflow:
          detail: 动态规划
          after: "{query}将动态规划多步执行"
          forced-after: "{query}将按您指定的「动态规划」模式处理"
        peer-collab:
          detail: 多专家协作
          after: "{query}将由多专家协作交叉验证"
          forced-after: "{query}将按您指定的「多专家协作」模式处理"
        # workflow 意图 after/forced-after：代码默认 AgentPromptProperties.IntentTimeline.defaultModes()
