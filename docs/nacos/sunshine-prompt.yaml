server:
  port: 8500

spring:
  datasource:
    url: jdbc:mysql://ecs4c16g:3306/sunshine_prompt?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: root
    password: root123
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

logging:
  level:
    com.sunshine: debug
