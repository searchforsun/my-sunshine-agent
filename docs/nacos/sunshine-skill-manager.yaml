# ============================================================
# sunshine-skill-manager — Nacos 配置
# Data ID: sunshine-skill-manager.yaml
# Group:   DEFAULT_GROUP
# 表结构 SSOT：docker/mysql/init/12-sunshine-skill-manager.sql（禁止 Flyway）
# Skill 包文件存储：MinIO ecs4c16g:9000 / bucket sunshine-skills
# ============================================================

server:
  port: 8225

spring:
  datasource:
    url: jdbc:mysql://ecs4c16g:3306/sunshine_skill?useUnicode=true&characterEncoding=utf-8&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    username: root
    password: root123
  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        timezone:
          default_storage: NORMALIZE_UTC
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

skill:
  storage:
    type: minio
    base-dir: data/skills
    minio:
      endpoint: http://ecs4c16g:9000
      access-key: minioadmin
      secret-key: minioadmin123
      bucket: sunshine-skills

logging:
  level:
    com.sunshine: debug
