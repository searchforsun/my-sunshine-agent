# ============================================================
# sunshine-tool-manager — Nacos 配置
# Data ID: sunshine-tool-manager.yaml
# Group:   DEFAULT_GROUP
# 表结构 SSOT：docker/mysql/init/16-sunshine-tool-manager.sql（禁止 Flyway）
# ============================================================

server:
  port: 8210

spring:
  datasource:
    url: jdbc:mysql://ecs4c16g:3306/sunshine_tool?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
  data:
    redis:
      host: ecs4c16g
      port: 6379
      password: redis123

tool:
  sdk:
    pull-interval-seconds: 60
    invoke-timeout-seconds: 30
  mcp:
    refresh-interval-seconds: 300
    invoke-timeout-seconds: 60
  timeline:
    result:
      hit-count:
        zero: "命中 0 条"
        with-count: "命中 {hitCount} 条"
        with-sources: "命中 {hitCount} 条，来源：{sources}"
      finance-list:
        zero: "0 条财务消息"
        with-count: "{count} 条财务消息"
      finance-summary:
        zero: "无汇总数据"
        with-data: "{status} {count} 条，合计 ¥{amount}"
      oa-tasks:
        zero: "0 条 OA 待办"
        with-count: "{count} 条 OA 待办"
      default-empty: "无结果"
      truncate-max-chars: 80

logging:
  level:
    com.sunshine: debug
