name: RAG Eval

on:
  workflow_dispatch:
    inputs:
      rag_url:
        description: RAG service base URL (default from secret RAG_URL)
        required: false
        default: ""
  push:
    branches: [main, master]
    paths:
      - rag-service/**
      - scripts/rag_eval.py
      - scripts/test_rag_eval_gates.py
      - docker/mysql/init/14-sunshine-rag-service.sql
      - scripts/verify_rag_studio.py

jobs:
  gate-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install script deps
        run: pip install -r scripts/requirements.txt
      - name: Gate logic unit tests
        run: python scripts/test_rag_eval_gates.py -v

  rag-regression:
    runs-on: ubuntu-latest
    needs: gate-logic
    if: ${{ secrets.RAG_URL != '' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install script deps
        run: pip install -r scripts/requirements.txt
      - name: Resolve RAG_URL
        id: rag
        run: |
          if [ -n "${{ github.event.inputs.rag_url }}" ]; then
            echo "url=${{ github.event.inputs.rag_url }}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.RAG_URL }}" ]; then
            echo "url=${{ secrets.RAG_URL }}" >> "$GITHUB_OUTPUT"
          else
            echo "RAG_URL not configured" >&2
            exit 1
          fi
      - name: Health check
        run: |
          curl -sf "${{ steps.rag.outputs.url }}/actuator/health" || \
          curl -sf "${{ steps.rag.outputs.url }}/api/rag/search" \
            -H 'Content-Type: application/json' \
            -d '{"query":"ping","topK":1}' >/dev/null
      - name: sunshine-regression hybrid+rerank gate
        env:
          RAG_URL: ${{ steps.rag.outputs.url }}
          RAG_ADMIN_TOKEN: ${{ secrets.RAG_ADMIN_TOKEN }}
        run: |
          python scripts/rag_eval.py \
            --suite-key sunshine-regression \
            --strategy hybrid+rerank \
            --ci \
            --tag ci-regression
      - name: sunshine-adversarial hybrid+rerank gate
        env:
          RAG_URL: ${{ steps.rag.outputs.url }}
          RAG_ADMIN_TOKEN: ${{ secrets.RAG_ADMIN_TOKEN }}
        run: |
          python scripts/rag_eval.py \
            --suite-key sunshine-adversarial \
            --strategy hybrid+rerank \
            --ci \
            --tag ci-adversarial
      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rag-regression-${{ github.run_id }}
          path: |
            reports/rag/eval-reports/baseline-*-ci-*.json
            reports/rag/eval-reports/rag-eval-report-*-ci-*.md
            reports/rag/regression-*.md
          if-no-files-found: ignore
